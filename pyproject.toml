[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-monitor"
version = "0.1.0"
description = "Юридический мониторинг законодательства РФ"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "feedparser>=6.0.0",
    "openai>=1.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0"]
browser = ["playwright>=1.45.0"]

[project.scripts]
legal-monitor = "legal_monitor.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
